
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine</title>

<style>
body {
margin: 0;
height: 100vh;
background: #ffd6e8;
display: flex;
justify-content: center;
align-items: center;
font-family: Arial, sans-serif;
}

.card {
background: #fff5f9;
width: 360px;
padding: 30px;
border-radius: 18px;
text-align: center;
box-shadow: 0 10px 25px rgba(0,0,0,0.1);
position: relative;
}

.emoji {
font-size: 48px;
margin-bottom: 10px;
}

h1 {
font-size: 20px;
margin-bottom: 25px;
color: #333;
}

.buttons {
position: relative;
height: 60px;
}

button {
padding: 12px 26px;
font-size: 16px;
border: none;
border-radius: 25px;
cursor: pointer;
}

#yes {
background: #ff4d6d;
color: white;
}

#no {
background: #eee;
position: absolute;
left: 120px;
top: 0;
}

.result {
display: none;
}

.result h2 {
margin-top: 10px;
color: #ff4d6d;
}

.result img {
margin-top: 15px;
width: 100%;
border-radius: 12px;
}
</style>
</head>

<body>

<div class="card" id="card">
<div class="emoji">🐱💖</div>

<h1>SENURI will you be my valentine?</h1>

<div class="buttons">
<button id="yes">Yes</button>
<button id="no">No</button>
</div>

<div class="result" id="result">
<h2>YAY! 🎉</h2>
<img src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExbHAzZ3hmMW0wajUxZDNtNXRzd2ltcGZsYzgxczBhMGZueXpjd3VrNiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/4VglqgTazN7YQ/giphy.gif" alt="funny image">
</div>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const result = document.getElementById("result");
const buttons = document.querySelector(".buttons");

noBtn.addEventListener("mouseover", () => {
const x = Math.random() * 220;
const y = Math.random() * 200;
noBtn.style.left = x + "px";
noBtn.style.top = y + "px";
});

yesBtn.addEventListener("click", () => {
buttons.style.display = "none";
result.style.display = "block";
});
</script>

</body>
</html>
